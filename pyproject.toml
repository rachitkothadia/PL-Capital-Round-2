[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pl-capital"
version = "1.0.0"
description = "Auditable local portfolio analytics powered by Groq and SQLite"
requires-python = ">=3.12,<3.15"
dependencies = [
  "groq>=0.32,<1", "textual>=6,<8", "rich>=14,<15",
  "sqlglot>=28,<29", "pydantic>=2.12,<3", "python-dotenv>=1.2,<2",
  "platformdirs>=4.5,<5", "filelock>=3.20,<4",
]

[project.optional-dependencies]
graph = ["falkordblite>=0.9,<1; sys_platform != 'win32'"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/pl_capital"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["graph: optional native FalkorDBLite integration", "live: real Groq network test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
